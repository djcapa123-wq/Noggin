<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noggin Daily Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion, grown-up: a primetime game-night broadcast
   IDEA a TV network with three shows: Daily Trivia, Long Shot, and the Hot Seat party game
   PICTURE a live, animated set per category; the party set is a lounge table with a whoopee cushion in the middle
   COLOUR each show and category owns a deep ground + one bright accent; warm off-white text; glass panels
   TYPE Barlow Condensed for scoreboards and titles + Inter for reading
   LAYOUT pages (home, boards, friends) are full-width grids; games are set + panel (stacked on phones) */
:root{--page:#15122b;--ac:#ffcf5a;--ink:#f4f0e8;--mute:#b6b0c4;--line:rgba(255,255,255,.14);--glass:rgba(10,10,18,.62);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{height:100%;background:var(--page);transition:background-color .8s ease}
body{min-height:100%;margin:0;color:var(--ink);font:500 16px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow-x:clip}
body.game{height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(90% 55% at 50% -8%,color-mix(in srgb,var(--ac) 24%,transparent),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(0,0,0,.35),transparent)}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px;width:min(1180px,100%);margin:0 auto}
.logo{font:800 30px/1 'Barlow Condensed',sans-serif;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.logo i{width:12px;height:12px;border-radius:3px;background:var(--ac);transform:rotate(45deg);transition:background-color .6s}
.meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.chip{font:700 17px/1 'Barlow Condensed',sans-serif;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.06);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--ac)}
button.chip{cursor:pointer}
.prog{display:flex;gap:5px;padding:2px 16px 12px;width:min(1180px,100%);margin:0 auto}
.prog:empty{display:none}
.prog span{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.14);transition:background-color .4s}
.prog .ok{background:var(--ac)}.prog .no{background:rgba(255,255,255,.4)}.prog .cur{background:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.wrap{flex:1;display:flex;flex-direction:column;gap:14px;width:min(640px,100%);margin:0 auto;padding:0 16px 18px;min-height:0}
.stage{position:relative;flex:1 1 220px;min-height:150px;max-height:400px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#000;isolation:isolate}
.scene{position:absolute;inset:0}
.scene svg{width:100%;height:100%;display:block}
.scene.in{animation:wipe .85s cubic-bezier(.7,0,.2,1) both}
@keyframes wipe{from{clip-path:circle(0% at 50% 58%)}to{clip-path:circle(130% at 50% 58%)}}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 70%,rgba(0,0,0,.35));pointer-events:none;z-index:3}
.tag{position:absolute;left:12px;top:12px;z-index:6;font:700 16px/1 'Barlow Condensed',sans-serif;padding:7px 11px 7px 9px;border-radius:9px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);display:flex;gap:7px;align-items:center}
.tag i{width:8px;height:8px;border-radius:2px;background:var(--ac)}
.tag2{left:auto;right:12px}
.bump{position:absolute;left:0;right:0;top:50%;z-index:8;translate:0 -50%;padding:12px 22px;background:var(--ac);color:#111;transform:translateX(-110%) skewX(-8deg);pointer-events:none}
.bump small{display:block;font:600 14px Inter,sans-serif;opacity:.75}
.bump b{display:block;font:800 clamp(40px,10vw,64px)/.95 'Barlow Condensed',sans-serif}
.bump.go{animation:bump 1.25s cubic-bezier(.7,0,.2,1) both}
@keyframes bump{0%{transform:translateX(-110%) skewX(-8deg)}22%,72%{transform:translateX(0) skewX(-8deg)}100%{transform:translateX(112%) skewX(-8deg)}}
.fly{position:absolute;left:50%;top:46%;z-index:9;translate:-50% -50%;font:800 clamp(48px,12vw,76px)/1 'Barlow Condensed',sans-serif;color:var(--ac);text-shadow:0 4px 24px rgba(0,0,0,.6);animation:fly 1.2s cubic-bezier(.2,.8,.2,1) both;pointer-events:none;white-space:nowrap}
@keyframes fly{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.08)}35%{transform:scale(1)}100%{opacity:0;transform:translateY(-70px)}}
.card{flex:0 1 auto;overflow:auto;min-height:0;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:18px 18px 20px}
.card.good{animation:good .7s}.card.bad{animation:bad .45s}
@keyframes good{30%{box-shadow:0 0 0 2px var(--ac),0 0 40px color-mix(in srgb,var(--ac) 45%,transparent)}}
@keyframes bad{20%,60%{translate:-7px 0;border-color:#ff6b6b}40%,80%{translate:7px 0}}
body.pg .stage{display:none}
body.pg .wrap{display:block;width:min(1180px,100%)}
body.pg .card{background:none;border:0;padding:4px 0 24px;backdrop-filter:none;-webkit-backdrop-filter:none;overflow:visible;max-height:none}
.in{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:800;line-height:1.02;margin:0;letter-spacing:-.005em}
h1{font-size:clamp(40px,9vw,52px);text-wrap:balance}h2{font-size:24px;margin:20px 0 10px}h3{font-size:30px}
.kick{margin:0 0 2px;color:var(--mute);font-weight:600}
.sub{margin:8px 0 14px;color:var(--mute);max-width:62ch}
.lbl{font-size:13px;color:var(--mute);font-weight:600}
.panel{border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:16px}
/* home */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 18px}
.me{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.show{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--glass);transition:transform .25s,border-color .25s}
.show:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--sc) 70%,transparent)}
.show .art{height:170px;position:relative;overflow:hidden}
.show .art svg{width:100%;height:100%;display:block}
.show .art .badge{position:absolute;left:12px;top:12px;font:700 15px/1 'Barlow Condensed',sans-serif;padding:6px 10px;border-radius:8px;background:var(--sc);color:#111}
.show .bd{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.show h3 span{color:var(--sc)}
.show p{margin:0;color:var(--mute);font-size:15px}
.show .st{margin-top:auto;padding-top:8px;font-size:14px;color:var(--mute)}
.show .st b{color:var(--ink)}
.show .btn{background:var(--sc)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.prow{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow b{font:800 18px 'Barlow Condensed',sans-serif}
.prow .rk{font:800 18px 'Barlow Condensed',sans-serif;color:var(--mute)}
.prow small{display:block;color:var(--mute);font-size:12px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.hd h2{margin:0}
.link{background:none;border:0;color:var(--ac);font-weight:600;cursor:pointer;padding:8px 0;min-height:40px}
/* game hud */
.hud{display:flex;align-items:flex-end;gap:18px}
.hud div{display:flex;flex-direction:column}
.hud b{font:800 34px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.hud .bon b{color:var(--ac)}
.tries{margin-left:auto;flex-direction:row!important;gap:6px;padding-bottom:6px}
.tries span{width:12px;height:12px;border-radius:50%;background:var(--ac);transition:background-color .3s}
.tries .used{background:rgba(255,255,255,.18)}
.meter{height:4px;border-radius:9px;background:rgba(255,255,255,.12);margin:12px 0 4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ac);width:100%}
.q{font:600 clamp(19px,4.4vw,23px)/1.35 Inter,sans-serif;margin:14px 0 16px;text-wrap:balance}
.q.big{font:800 clamp(30px,7vw,40px)/1.05 'Barlow Condensed',sans-serif}
.q.wait{opacity:0}
form{display:flex;gap:10px}
input,select{flex:1;font:600 17px Inter,sans-serif;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px 14px;min-height:50px;background:rgba(255,255,255,.07);color:var(--ink)}
select{flex:none;font-size:16px;min-height:44px;padding:8px 12px}
select option{background:#1a1726}
input::placeholder{color:#8f89a0}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
input:disabled{opacity:.5}
.btn{font:700 19px/1 'Barlow Condensed',sans-serif;letter-spacing:.01em;min-height:50px;padding:12px 20px;border:1px solid transparent;border-radius:12px;background:var(--ac);color:#111;cursor:pointer;transition:transform .12s,filter .2s,background-color .6s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn:focus-visible,.link:focus-visible,.tab:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border-color:var(--line)}
.btn.sm{font-size:16px;min-height:44px;padding:8px 14px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.msg{margin:10px 0 0;color:var(--mute);font-size:15px}
.hint{font:700 20px 'Barlow Condensed',sans-serif;letter-spacing:.18em;color:var(--ink)}
.fb{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.fb.yes{border-color:color-mix(in srgb,var(--ac) 60%,transparent);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.fb b{display:block;font:800 28px/1.05 'Barlow Condensed',sans-serif}
.fb.yes b{color:var(--ac)}
.fb span{color:var(--mute);font-size:15px}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cats span{display:flex;align-items:center;gap:7px;font:700 16px/1 'Barlow Condensed',sans-serif;padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.cats i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.acts .btn{flex:1 1 130px}
.note{font-size:13px;color:var(--mute);margin:12px 0 0}
.err{color:#ff9a9a;font-size:14px;margin:8px 0 0}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big{font:800 clamp(64px,15vw,88px)/.9 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;color:var(--ac)}
.score span{font:700 22px 'Barlow Condensed',sans-serif;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:14px}
.tile{border-radius:11px;padding:9px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px;color:var(--mute)}
.tile b{display:block;font:700 17px/1.1 'Barlow Condensed',sans-serif;color:var(--ink)}
.tile.ok{border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent)}
.post{margin-top:16px;padding:14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--ac) 50%,transparent);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.post p{margin:0 0 10px}
.lr{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lr:last-child{border-bottom:0}
.lr .rk{font:800 18px 'Barlow Condensed',sans-serif;color:var(--mute)}
.lr .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .n small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.lr .s{font:800 20px 'Barlow Condensed',sans-serif;text-align:right}
.lr .t{color:var(--mute);font-size:14px;text-align:right;white-space:nowrap}
.lr.me{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.you{font:700 11px Inter,sans-serif;color:#111;background:var(--ac);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.empty{padding:16px;color:var(--mute)}
.scroll{max-height:min(52vh,460px);overflow-y:auto;border-radius:12px;border:1px solid var(--line)}
/* tabs + boards */
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;border:1px solid var(--line);width:max-content;max-width:100%;flex-wrap:wrap}
.tab{font:600 15px Inter,sans-serif;border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;min-height:40px;color:var(--mute)}
.tab.on{background:rgba(255,255,255,.12);color:var(--ink)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.boardgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.podium{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.champ{grid-column:1/-1;position:relative;overflow:hidden;border-radius:16px;padding:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 30%,#000),rgba(255,255,255,.04));border:1px solid color-mix(in srgb,var(--ac) 70%,transparent)}
.champ::after{content:"";position:absolute;inset:-50% auto -50% -30%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,40%{left:-40%}80%,100%{left:130%}}
.spot{border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid var(--line);position:relative}
.podium .lbl{display:block}
.podium .nm{display:block;font:800 26px/1.05 'Barlow Condensed',sans-serif;overflow-wrap:anywhere}
.champ .nm{font-size:clamp(34px,8vw,48px)}
.podium .st{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.podium .st b{color:var(--ink);font:800 20px 'Barlow Condensed',sans-serif}
.medal{position:absolute;right:12px;top:10px;font:800 40px/1 'Barlow Condensed',sans-serif;opacity:.25}
.champ .medal{font-size:64px;opacity:.35}
.rise{animation:rise .7s cubic-bezier(.2,.9,.2,1.1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}}
.lh{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.lh h2{margin:0}
/* friends */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fc{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(255,255,255,.04)}
.fc .top2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:800 18px 'Barlow Condensed',sans-serif;color:#111;background:hsl(var(--h) 80% 70%);flex:none}
.fc .nm{font:800 22px/1 'Barlow Condensed',sans-serif}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv div{border-radius:10px;background:rgba(255,255,255,.05);padding:7px 8px;font-size:12px;color:var(--mute)}
.kv b{display:block;font:800 21px/1.1 'Barlow Condensed',sans-serif;color:var(--ink)}
.today{margin-top:8px;font-size:13px;color:var(--mute)}
.today b{color:var(--ink)}
.code{font:800 34px/1 'Barlow Condensed',sans-serif;letter-spacing:.12em;color:var(--ac)}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.ubtn{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;min-height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;font:700 17px/1 'Barlow Condensed',sans-serif;color:var(--ink)}
.ubtn.solo{padding:4px}
.ubtn .av{width:32px;height:32px;border-radius:9px;font-size:15px}
.ubtn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,5,14,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fade .25s both}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.mbox{position:relative;width:min(430px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:22px;background:linear-gradient(180deg,#1f1a38,#15122b);border:1px solid var(--line);padding:24px 22px 22px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .4s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}}
.mbox h2{font-size:34px;margin:0 0 4px}
.mx{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.picrow{display:flex;align-items:center;gap:16px;margin:16px 0}
.picrow .av{width:84px;height:84px;border-radius:24px;font-size:34px;flex:none}
.picbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mbox form{margin-top:6px}
.mbox .sect{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
 [data-pid]{cursor:pointer}
.lr[data-pid]:hover,.prow[data-pid]:hover{background:rgba(255,255,255,.05)}
.spot[data-pid]:hover,.champ[data-pid]:hover{border-color:var(--ac)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.qrow .qa{font-weight:700}
.qrow .qq{font-size:13px;color:var(--mute)}
.qrow .ok{color:var(--ac);font:800 18px 'Barlow Condensed',sans-serif;white-space:nowrap;text-align:right}
.qrow .no{color:#ff9a9a;font:800 18px 'Barlow Condensed',sans-serif;white-space:nowrap;text-align:right}
.lockd{margin-top:12px;padding:14px;border-radius:12px;border:1px dashed var(--line);color:var(--mute)}
.filein{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.mini2{display:flex;gap:10px;flex-wrap:wrap}
.mini2 input{min-width:160px}
/* long shot */
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 26px 'Barlow Condensed',sans-serif}
.tier{display:inline-flex;align-items:center;gap:6px;font:800 15px/1 'Barlow Condensed',sans-serif;padding:5px 9px;border-radius:7px;background:color-mix(in srgb,var(--t) 22%,transparent);color:var(--t);border:1px solid color-mix(in srgb,var(--t) 55%,transparent);white-space:nowrap}
.odds{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lsr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lsr:last-child{border-bottom:0}
.lsr .p{color:var(--mute);font-size:13px}
.lsr .a{font:800 22px/1.1 'Barlow Condensed',sans-serif}
.lsr .pop{grid-column:1/-1;font-size:13px;color:var(--mute)}
.lsr .pts{font:800 24px 'Barlow Condensed',sans-serif;text-align:right}
.lsr .link{grid-column:1/-1;justify-self:start;min-height:36px;padding:4px 0}
.exp{grid-column:1/-1;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.exp[hidden]{display:none}
.exp h4{margin:0;font:700 13px Inter,sans-serif;color:var(--mute)}
.ar{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:9px;overflow:hidden;margin-top:6px;background:rgba(255,255,255,.03)}
.ar .bar{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--ac) 20%,transparent);transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.ar>*:not(.bar){position:relative}
.ar.mine{box-shadow:inset 0 0 0 1px var(--ac)}
.ar .an{font-weight:700;overflow-wrap:anywhere}
.ar .ct{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ar .ct .tier{font-size:12px;padding:3px 6px}
.ar .who{grid-column:1/-1;font-size:12px;color:var(--mute)}
.allans{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.allans span{font-size:13px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--mute)}
.allans .said{color:var(--ink);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.allans b{margin-left:5px}.allans .said b{color:var(--ac)}
.allans .mine{background:var(--ac);border-color:var(--ac);color:#111}
.allans .mine b{color:#111}
/* party */
.arena{position:absolute;inset:0;z-index:5}
body.party .stage{min-height:260px}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:104px;text-align:center;transition:opacity .4s}
.seat .av{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.4);transition:transform .3s,box-shadow .3s}
.seat b{font:700 15px/1.1 'Barlow Condensed',sans-serif;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.seat .lv{display:flex;gap:2px;height:14px}
.seat .lv svg{width:18px;height:14px}
.seat .lv .gone{opacity:.18}
.seat.cur .av{transform:scale(1.18);box-shadow:0 0 0 3px var(--ac),0 0 26px var(--ac)}
.seat.out{opacity:.35}
.seat .bub{position:absolute;bottom:100%;margin-bottom:4px;max-width:150px;padding:5px 9px;border-radius:9px;background:#fff;color:#111;font:600 13px Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .bub:empty{display:none}
.cush{position:absolute;left:50%;top:52%;width:clamp(84px,22%,150px);z-index:6;transform:translate(-50%,-50%);pointer-events:none}
.cush .wob{animation:wob var(--wd,1.2s) ease-in-out infinite}
.cush svg{width:100%;display:block;overflow:visible}
@keyframes wob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
.cush.blow .wob{animation:blow 1.1s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes blow{0%{transform:scale(1.15)}15%{transform:scale(1.35,.8)}35%{transform:translate(30px,-40px) rotate(220deg) scale(.7)}60%{transform:translate(-50px,-10px) rotate(480deg) scale(.5)}100%{transform:translate(0,0) rotate(720deg) scale(.35);opacity:0}}
.pfft{position:absolute;left:50%;top:44%;z-index:9;translate:-50% -50%;font:800 clamp(54px,14vw,96px)/1 'Barlow Condensed',sans-serif;color:#ff5f8f;text-shadow:0 0 30px rgba(255,95,143,.6),0 4px 0 #111;animation:pf 1.6s cubic-bezier(.2,.8,.2,1) both;pointer-events:none;white-space:nowrap}
@keyframes pf{0%{opacity:0;transform:scale(.4) rotate(-8deg)}15%{opacity:1;transform:scale(1.15) rotate(3deg)}30%{transform:scale(1) rotate(-2deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-30px)}}
.plog{display:flex;flex-direction:column;gap:6px;margin-top:14px;max-height:180px;overflow:auto}
.plog div{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--mute)}
.plog b{color:var(--ink);font-weight:600}
.plog .ok b:last-child{color:var(--ac)}
.plog .no b:last-child{text-decoration:line-through;color:#ff9a9a}
.plog .pop{color:#ff5f8f;font-weight:700}
.turn{font:800 24px/1.1 'Barlow Condensed',sans-serif;margin:0}
.turn.mine{color:var(--ac)}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.plist div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.plist .av{width:32px;height:32px;border-radius:50%;font-size:15px}
.plist span:not(.av){flex:1;font-weight:600}
.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.sets label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute);font-weight:600}
.sets select{width:100%}
.rooms{display:flex;flex-direction:column;gap:8px}
.rooms div{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.rooms span{flex:1}
.rules{margin:0;padding-left:20px;color:var(--mute)}
.rules li{margin:5px 0}
textarea{width:100%;font:14px Inter;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:10px;padding:8px;margin-top:8px}
/* scene motion */
.a-float{animation:fl 3.6s ease-in-out infinite}
.a-spin{animation:sp 5s linear infinite;transform-box:fill-box;transform-origin:center}
.a-pulse{animation:pu 4s ease-in-out infinite}
.a-bounce{animation:bo 1.5s cubic-bezier(.45,0,.55,1) infinite}
.a-sway{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
.a-slide{animation:sl 2.6s ease-in-out infinite}
.a-tw{animation:pu 2.4s ease-in-out infinite}
.a-scroll{animation:scr 26s linear infinite}
.a-chase{animation:ch 1.2s steps(2) infinite}
.a-flick{animation:fk 2.3s ease-in-out infinite}
.a-steam{animation:stm 2.8s ease-out infinite;opacity:0}
.a-drift{animation:dr 9s ease-in-out infinite alternate}
.a-rise{animation:ris 2.6s ease-in infinite;opacity:0}
.a-rot{animation:sp 16s linear infinite}
.a-sweep{animation:swp 6s ease-in-out infinite}
.a-eq{animation:eq .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
.a-dart{animation:dart 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}
@keyframes fl{50%{transform:translateY(-7px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{50%{opacity:.55}}
@keyframes bo{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px)}}
@keyframes sw{50%{transform:skewX(5deg)}}
@keyframes sl{50%{transform:translateX(12px)}}
@keyframes scr{to{transform:translateX(-170px)}}
@keyframes ch{50%{opacity:.25}}
@keyframes fk{50%{opacity:.82}}
@keyframes stm{0%{opacity:0;transform:translateY(8px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-22px)}}
@keyframes dr{to{transform:translateX(70px)}}
@keyframes ris{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-84px)}}
@keyframes swp{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes eq{to{transform:scaleY(.3)}}
@keyframes dart{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-4deg)}84%{transform:rotate(3deg)}92%{transform:rotate(-1deg)}}
@media(min-width:900px){
body.game .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;gap:26px;width:min(1180px,100%)}
body.game .stage{height:min(72vh,600px);max-height:none}
body.game .card{max-height:calc(100vh - 120px)}
}
@media(max-width:899px){.shows{grid-template-columns:minmax(0,1fr)}.two,.boardgrid{grid-template-columns:minmax(0,1fr)}.show .art{height:150px}}
@media(max-width:560px){.seat{width:78px}.seat .av{width:36px;height:36px;font-size:15px}.seat b{font-size:13px}.seat .lv svg{width:14px;height:11px}}
@media(max-width:420px){.hud{gap:12px}.hud b{font-size:30px}.lr{gap:8px;grid-template-columns:2em minmax(0,1fr) auto auto}.sets{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bump{display:none}.q.wait{opacity:1}}
</style>

const lev=(a,b)=>{const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]};

function pState(){const H=P.H,n=performance.now();return{...H,held:P.fuse?Math.round(n-P.fuse.start):0,pop:H.pop?{id:H.pop.id,ago:Math.round(n-H.pop.at)}:null}}

function alive(){return P.H.pl.filter(p=>p.lives>0)}
function nextAlive(id){const pl=P.H.pl,i=pl.findIndex(p=>p.id===id);for(let k=1;k<=pl.length;k++){const p=pl[(i+k)%pl.length];if(p.lives>0)return p.id}return id}
function pickPrompt(){const gs=GROUPS[P.H.set.cats]||GROUPS.mix,opts=D.LONGSHOT.map((p,i)=>i).filter(i=>gs.includes(D.LONGSHOT[i][1])&&list(i).n.length>=19&&i!==P.H.pi);return opts[Math.floor(Math.random()*opts.length)]??0}
function startFuse(){const[a,b]=FUSES[P.H.set.fuse]||FUSES.normal,n=performance.now();P.fuse={start:n,end:n+(a+Math.random()*(b-a))*1000}}
function hStart(){const H=P.H;if(H.pl.length<2)return;for(const p of H.pl)p.lives=H.set.lives;H.stg='play';H.win=null;H.log=[];H.rd=1;H.pi=pickPrompt();H.used=[];H.pop=null;H.turn=H.pl[Math.floor(Math.random()*H.pl.length)].id;startFuse();P.botAt=0;S.screen='pgame';pEmit();partyView()}

function botMove(b){const H=P.H,L=list(H.pi),free=L.n.map((x,i)=>i).filter(i=>!H.used.includes(i)),r=Math.random();

 else P.botAt=performance.now()+2500+Math.random()*3000}

 if(!V){tags('Hot Seat','Room '+P.code);meta(`<span class="chip">Room <b>${esc(P.code)}</b></span>`);$('arena').innerHTML='';$('card').innerHTML=`<h3>Joining room ${esc(P.code)}…</h3><p class="sub">Waiting for the host. If nothing happens, check the code.</p><div class="acts"><button class="btn ghost" id="lv">Leave</button></div>`;$('lv').onclick=()=>partyHome();return}
 const me=myId(),host=P.role==='host',pl=V.pl||[],nameBy=id=>(pl.find(p=>p.id===id)||{}).name||'Someone';
 tags('Hot Seat',V.stg==='lobby'?'Room '+P.code:`Round ${V.rd}`);meta(`<span class="chip">Room <b>${esc(P.code)}</b></span><button class="chip" id="sndc">Sound ${SOUND?'on':'off'}</button>`);$('sndc').onclick=()=>{SOUND=!SOUND;store('noggin-snd',SOUND);audio();partyView()};
 const ar=$('arena');
 const akey=JSON.stringify([pl.map(p=>[p.id,p.name,p.lives,p.bot]),V.turn,V.stg,V.set.lives,me]);if(ar.dataset.k!==akey){ar.dataset.k=akey;ar.innerHTML=pl.map((p,i)=>{const s=seatPos(i,pl.length);return `<div class="seat ${p.id===V.turn&&V.stg==='play'?'cur':''} ${p.lives<=0&&V.stg!=='lobby'?'out':''}" style="left:${s.x.toFixed(1)}%;top:${s.y.toFixed(1)}%"><div class="bub" data-ty="${esc(p.id)}"></div>${avatar(p.name,p.pid||p.id)}<b>${esc(p.name)}${p.id===me?' (you)':''}</b><span class="lv">${R(V.set.lives,k=>ROLL(k>=p.lives))}</span></div>`}).join('')+`<div class="cush" id="cush"><div class="wob">${cushion()}</div></div>`}
 cushTick();
 const card=$('card');
 if(V.stg==='lobby'){const opt=(k,v,lbl)=>`<option value="${v}" ${String(V.set[k])===String(v)?'selected':''}>${lbl}</option>`;
  card.innerHTML=`<p class="kick">Waiting room</p><h3>Room code <span style="color:var(--ac);letter-spacing:.1em">${esc(P.code)}</span></h3><p class="sub" style="margin-top:6px">${host?(P.R?'Friends join from Hot Seat with this code. Add bots to fill seats.':'Live rooms aren’t available here, so add bots to play.'):'The host will start the game.'}</p>
  <div class="plist">${pl.map(p=>`<div>${avatar(p.name,p.pid||p.id)}<span>${esc(p.name)}${p.id==='h'?' · host':''}${p.bot?' · bot':''}${p.id===me?' (you)':''}</span>${host&&p.bot?`<button class="btn ghost sm" data-kb="${esc(p.id)}">Remove</button>`:''}</div>`).join('')}</div>
  ${host?`<div class="sets"><label>Rolls (lives)<select id="s-lives">${[1,2,3,4,5].map(v=>opt('lives',v,v+(v===1?' roll':' rolls'))).join('')}</select></label><label>Fuse<select id="s-fuse">${opt('fuse','short','Short · 5 to 15 s')}${opt('fuse','normal','Normal · 10 to 30 s')}${opt('fuse','long','Long · 20 to 40 s')}</select></label><label>Seconds after a pass<select id="s-pass">${[5,8,12].map(v=>opt('pass',v,'At least '+v+' s')).join('')}</select></label><label>Categories<select id="s-cats">${opt('cats','mix','Everything')}${opt('cats','sports','Sports & cars')}${opt('cats','geo','Geography')}${opt('cats','pop','Food & pop culture')}${opt('cats','sci','Science & body')}${opt('cats','hist','History & local')}</select></label></div>
   <div class="acts"><button class="btn ghost" id="addb" ${pl.length>=10?'disabled':''}>Add a bot</button><button class="btn" id="go" ${pl.length<2?'disabled':''}>Start game</button></div>`:
   `<p class="lbl">${V.set.lives} rolls each · ${V.set.fuse} fuse · ${esc({mix:'Everything',sports:'Sports & cars',geo:'Geography',pop:'Food & pop culture',sci:'Science & body',hist:'History & local'}[V.set.cats]||'')}</p>`}
  <div class="acts"><button class="btn ghost" id="lv">${host?'Close room':'Leave room'}</button></div>`;
  if(host){['lives','fuse','pass','cats'].forEach(k=>$('s-'+k).onchange=e=>{const v=e.target.value;P.H.set[k]=k==='lives'||k==='pass'?+v:v;if(k==='lives')P.H.pl.forEach(p=>p.lives=+v);pEmit();partyView()});
   $('addb').onclick=()=>{const used=new Set(P.H.pl.map(p=>p.name)),nm=BOTN.find(n=>!used.has(n))||'Bot '+P.H.pl.length;P.H.pl.push({id:'b'+Math.random().toString(36).slice(2,7),name:nm,lives:P.H.set.lives,bot:1});pEmit();partyView()};
   $('go').onclick=()=>{audio();hStart()};document.querySelectorAll('[data-kb]').forEach(b=>b.onclick=()=>{P.H.pl=P.H.pl.filter(p=>p.id!==b.dataset.kb);pEmit();partyView()})}
  $('lv').onclick=()=>partyHome();return}
 const L=list(V.pi),mine=V.turn===me&&V.stg==='play'&&!V.pop;
 const logs=(V.log||[]).map(l=>l.pop?`<div class="pop">${esc(nameBy(l.id))} got blown out of the hot seat and lost a roll.</div>`:`<div class="${l.ok?'ok':'no'}"><b>${esc(nameBy(l.id))}</b><b>${esc(l.t)}</b>${l.ok?'':`<span>${esc(l.why)}</span>`}</div>`).join('');
 if(V.stg==='over'){const w=pl.find(p=>p.id===V.win);card.innerHTML=`<p class="kick">Game over</p><h3 style="font-size:44px;color:var(--ac)">${esc(w?w.name:'Nobody')} wins</h3><p class="sub">Last one standing after ${V.rd} ${V.rd===1?'round':'rounds'}.</p><div class="plog">${logs}</div><div class="acts">${host?`<button class="btn" id="again">Back to waiting room</button>`:''}<button class="btn ghost" id="lv">Leave</button></div>`;
  if(host)$('again').onclick=()=>{const H=P.H;H.stg='lobby';H.pop=null;H.win=null;H.log=[];H.pl.forEach(p=>p.lives=H.set.lives);S.screen='plobby';pEmit();partyView()};$('lv').onclick=()=>partyHome();return}
 const keep=$('pans')?$('pans').value:'';const hadFocus=document.activeElement&&document.activeElement.id==='pans';
 card.innerHTML=`<span class="lbl">Round ${V.rd} · ${(V.used||[]).length} said</span><p class="q big" style="margin:6px 0 10px">${esc(L?L.q:'')}</p>
 <p class="turn ${mine?'mine':''}">${V.pop?`${esc(nameBy(V.pop.id))} got blown!`:mine?'You’re on the hot seat. Name one and pass it!':`${esc(nameBy(V.turn))} is on the hot seat`}</p>
 <form id="pf" style="margin-top:12px"><input id="pans" ${mine?'':'disabled'} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${mine?'Your answer':'Wait for your turn'}" aria-label="Your answer"><button class="btn" ${mine?'':'disabled'}>Pass it</button></form>
 ${P.lost?'<p class="err">Lost contact with the host. Waiting…</p>':''}
 <div class="plog">${logs}</div>
 <div class="acts">${host?'<button class="btn ghost sm" id="endg">End game</button>':''}<button class="btn ghost sm" id="lv">Leave</button></div>`;
 const inp=$('pans');if(mine){inp.value=keep;if(hadFocus||fine())inp.focus()}
 inp.oninput=()=>{const v=inp.value.slice(0,40);if(P.R)P.R.presence({typing:v}).catch(()=>{});P.typing[me]=v;cushTick()};
 $('pf').onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v||!mine)return;inp.value='';if(P.R)P.R.presence({typing:''}).catch(()=>{});P.typing[me]='';if(P.role==='host')hAns('h',v);else P.R&&P.R.emit('ans',{text:v}).catch(()=>{})};
 if($('endg'))$('endg').onclick=()=>{const H=P.H;H.stg='lobby';H.pop=null;H.pl.forEach(p=>p.lives=H.set.lives);S.screen='plobby';pEmit();partyView()};
 $('lv').onclick=()=>partyHome()}
function cushTick(){const V=PV(),c=$('cush');if(!V||!c)return;const pl=V.pl||[],i=pl.findIndex(p=>p.id===V.turn);
 const show=V.stg==='play';c.style.opacity=show?1:.35;
 let held=V.held||0;if(P.role==='guest')held+=performance.now()-P.vt;
 const sc=show&&!V.pop?1+Math.min(.55,held/45000):1;
 if(i>=0){const s=seatPos(i,pl.length);let tgt=s.a*180/Math.PI-90;let d=((tgt-CANG)%360+540)%360-180;CANG+=d*.25}
 c.style.transform=`translate(-50%,-50%) rotate(${CANG.toFixed(1)}deg) scale(${sc.toFixed(3)})`;
 const w=c.querySelector('.wob');if(w)w.style.setProperty('--wd',(1.3-Math.min(1,held/30000)*.95).toFixed(2)+'s');
 if(V.stg!=='play'||!V.pop)c.classList.remove('blow');
 document.querySelectorAll('[data-ty]').forEach(b=>{const id=b.dataset.ty;let t=id===V.turn&&V.stg==='play'&&!V.pop?(P.typing[id]||''):'';const pp=pl.find(p=>p.id===id);if(pp&&pp.bot&&id===V.turn&&!V.pop&&V.stg==='play')t='thinking…';if(b.textContent!==t)b.textContent=t})}
/* ---------- boot ---------- */
$('logo').onclick=()=>{if((S.screen==='play'&&S.res&&S.res.length)||(S.screen==='ls'&&S.picks&&S.picks.length))return;home()};
window.claude?.hot?.snapshot?.(()=>S.screen==='play'||S.screen==='ls'?S:{screen:'home'});
const start=d=>{if(d&&d.screen==='play'&&d.list){S=d;S.run=false;mode2game();S.fb?draw():startQ()}else if(d&&d.screen==='ls'&&d.ids){S=d;S.run=false;mode2game();S.res?lsDraw():lsQ()}else home()};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
